<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFFICE IKEDA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Hiragino Kaku Gothic ProN", sans-serif;
  background: #080808;
  color: #fff;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px 15px 40px;
}

/* ヘッダー */
.header {
  text-align: center;
  padding: 35px 15px 30px;
  border-bottom: 1px solid #333;
}

.header .heart {
  color: #ff4fa3;
  font-size: 28px;
}

.header h1 {
  margin: 8px 0 5px;
  font-size: 34px;
  letter-spacing: 3px;
}

.header p {
  margin: 0;
  color: #aaa;
  font-size: 12px;
  letter-spacing: 3px;
}

/* カード */
.card {
  background: #111;
  border: 1px solid #292929;
  border-radius: 18px;
  margin-top: 18px;
  padding: 22px;
  box-shadow: 0 8px 25px rgba(0,0,0,.35);
}

.card h2 {
  margin: 0;
  font-size: 22px;
}

.subtitle {
  color: #ff4fa3;
  font-size: 11px;
  letter-spacing: 2px;
  margin: 7px 0 18px;
}

/* ボタン */
.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.button {
  display: block;
  text-decoration: none;
  text-align: center;
  padding: 15px 8px;
  border-radius: 12px;
  background: #1d1d1d;
  border: 1px solid #383838;
  color: #fff;
  font-weight: bold;
  transition: .2s;
}

.button:hover {
  transform: translateY(-2px);
  border-color: #ff4fa3;
  box-shadow: 0 0 15px rgba(255,79,163,.3);
}

.youtube {
  background: #ff174f;
  border-color: #ff174f;
}

.gare {
  background: #202020;
}

/* お問い合わせ */
.contact {
  text-align: center;
  background: linear-gradient(135deg,#ff3f91,#ff69ae);
  border: none;
}

.contact a {
  display: block;
  color: #fff;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  padding: 5px;
}

/* フッター */
footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="heart">🩷</div>
    <h1>OFFICE IKEDA</h1>
    <p>OFFICIAL APP</p>
  </header>


  <!-- IKE TUBE 1 -->
  <section class="card">
    <h2>▶️ IKE TUBE 1</h2>
    <div class="subtitle">REAL DOCUMENTARY</div>

    <div class="buttons">
      <a class="button youtube" href=https://www.youtube.com/@sapporo0204>▶ YouTube</a>
      <a class="button" href=”https://www.youtube.com/@sapporo0204/posts”>最新投稿</a>
    </div>
  </section>


  <!-- IKE TUBE 2 -->
  <section class="card">
    <h2>▶️ IKE TUBE 2</h2>
    <div class="subtitle">REAL DOCUMENTARY</div>

    <div class="buttons">
      <a class="button youtube" href="youtube.com/@sapporo2025?si=SjzoC4a0AT2CnHKv">▶ YouTube</a>
      <a class="button" href="#">最新動画</a>
    </div>
  </section>


  <!-- IKE GARE -->
  <section class="card">
    <h2>🏍️ IKE GARE</h2>
    <div class="subtitle">MOTORCYCLE GARAGE</div>

    <div class="buttons">
      <a class="button gare" href="#">🏍️ バイク在庫</a>
      <a class="button gare" href="#">🔧 部品販売</a>
    </div>
  </section>


  <!-- CONTACT -->
  <section class="card contact">
    <a href="#">✉ お問い合わせ</a>
  </section>


  <footer>
    © OFFICE IKEDA
  </footer>

</div>

</body>
</html>
